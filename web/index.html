<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>BTC Options</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="payoff.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" data-t-label="appName">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M12.5 8.5v15M15.5 8.5v15M11 10h7.2a3.3 3.3 0 0 1 0 6.6H11M11 16.6h8a3.5 3.5 0 0 1 0 7H11"/></svg>
        <span data-t="appName">BTC Options</span>
      </a>
      <p class="nav-price" id="navPrice" aria-hidden="true"></p>
      <div class="nav-actions">
        <span class="status" id="status" data-state="loading" role="status"><i></i><span id="statusText"></span></span>
        <button class="nav-button" id="langButton" type="button"></button>
        <button class="nav-button icon" id="themeButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="banner" id="banner" role="alert" hidden></div>

    <section class="hero container" id="hero">
      <p class="eyebrow" data-t="indexLabel">Bitcoin index price</p>
      <p class="hero-price"><span id="indexPrice">—</span><span class="unit">USDT</span></p>
      <p class="hero-note" id="heroNote"></p>
    </section>

    <div class="toolbar" id="toolbar">
      <div class="container toolbar-inner">
        <div class="pickers">
          <div class="segmented" id="directionPicker" role="group" data-t-label="direction">
            <button type="button" data-value="SELL" data-t="sell">Sell</button>
            <button type="button" data-value="BUY" data-t="buy">Buy</button>
          </div>
          <div class="segmented" id="sidePicker" role="group" data-t-label="optionType">
            <button type="button" data-value="PUT" data-t="puts">Puts</button>
            <button type="button" data-value="CALL" data-t="calls">Calls</button>
          </div>
        </div>
        <div class="expiries" id="expiries" role="group" data-t-label="expiries"></div>
      </div>
    </div>

    <div class="container">
      <section class="board" aria-labelledby="boardTitle">
        <header class="board-head">
          <h1 id="boardTitle">&nbsp;</h1>
          <p id="boardNote">&nbsp;</p>
        </header>
        <table class="chain" id="chain">
          <thead><tr id="chainHead"></tr></thead>
          <tbody id="chainBody"></tbody>
        </table>
        <p class="empty" id="empty" hidden></p>
      </section>
      <footer class="footer"><p data-t="footer"></p></footer>
    </div>
  </main>

  <dialog class="inspector" id="inspector" tabindex="-1" aria-labelledby="sheetTitle">
    <div class="grabber" id="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <p class="eyebrow" id="sheetEyebrow"></p>
        <h2 id="sheetTitle"></h2>
        <p class="sheet-note" id="sheetNote"></p>
      </div>
      <button class="close-button" id="sheetClose" type="button" data-t-label="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>

    <div class="segmented wide" id="sheetDirection" role="group" data-t-label="direction">
      <button type="button" data-value="SELL" data-t="sell">Sell</button>
      <button type="button" data-value="BUY" data-t="buy">Buy</button>
    </div>

    <section class="headline">
      <p class="label" id="totalLabel"></p>
      <p class="total"><span id="totalValue">—</span><span class="unit">USDT</span></p>
      <p class="caption" id="totalNote"></p>
    </section>

    <div class="form-group">
      <div class="form-row">
        <label class="form-label" for="priceInput" data-t="price">Price</label>
        <span class="form-control">
          <input id="priceInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
          <button class="live-tag" id="priceLive" type="button"></button>
        </span>
      </div>
      <div class="form-row">
        <label class="form-label" for="quantityInput" data-t="quantity">Quantity</label>
        <span class="form-control stepper">
          <button type="button" id="quantityDown" data-t-label="less">−</button>
          <input id="quantityInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">
          <button type="button" id="quantityUp" data-t-label="more">+</button>
          <span class="unit">BTC</span>
        </span>
      </div>
    </div>

    <section class="payoff">
      <div class="readout">
        <p class="label" data-t="pnlAtExpiry">P&amp;L at expiry</p>
        <p class="readout-value" id="readoutValue">—</p>
        <p class="caption" id="readoutNote"></p>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <dl class="stats" id="stats"></dl>

    <section class="details">
      <h3 data-t="market">Market</h3>
      <dl class="details-list" id="details"></dl>
    </section>

    <p class="fineprint" data-t="fineprint"></p>
  </dialog>
</body>
</html>
